name: Bounded public-source recovery
on:
  push:
    branches: [eval/2026-10-01-final-source-proof]
    paths: [.github/workflows/bounded-source-recovery.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read four selected public sources with TLS and robots checks
        shell: python
        run: |
          import datetime,hashlib,json,pathlib,time,urllib.request,urllib.error,urllib.parse,urllib.robotparser
          out=pathlib.Path('evidence');out.mkdir();agent='ProcurementForecastResearch/1.0'
          targets=[
            ('ddc-2025-2','https://www.ddc.go.kr/site/ddc/download/file_2025/2nd/file2025_02_01.pdf'),
            ('uiwang-2025-3','https://www.uiwang.go.kr/comm/getFile?srvcId=MEDIA&upperNo=3116&fileTy=MEDIA&fileNo=1'),
            ('gm-contract-form','https://www.gm.go.kr/pt/disclosure/bidContractInfo/contractInfo/contractList.do?q_optionalYn=N'),
            ('gm-tender-form','https://www.gm.go.kr/pt/user/nftcBbs/BD_selectNftcBbsList.do?q_nftcBbsCode=1003')]
          policies={}
          for name,url in targets:
            d={'id':name,'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'model_executed':False}
            try:
              root='https://'+urllib.parse.urlsplit(url).netloc
              if root not in policies:
                try:
                  with urllib.request.urlopen(urllib.request.Request(root+'/robots.txt',headers={'User-Agent':agent}),timeout=15) as r: robot=r.read()
                  (out/(urllib.parse.urlsplit(root).netloc+'-robots.txt')).write_bytes(robot)
                  p=urllib.robotparser.RobotFileParser();p.parse(robot.decode('utf-8',errors='replace').splitlines())
                except urllib.error.HTTPError as exc:
                  if exc.code!=404:raise
                  p=None;d['robots_status']=404
                policies[root]=p
              p=policies[root]
              if p is not None and not p.can_fetch(agent,url):raise RuntimeError('robots excludes selected source')
              time.sleep(max(2,(p.crawl_delay(agent) or 0) if p else 0))
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=40) as r:
                raw=r.read(32000001)
                if len(raw)>32000000:raise RuntimeError('input exceeds bounded size')
                d.update(status=r.status,final_url=r.url,content_type=r.headers.get('Content-Type'))
              (out/(name+'.raw')).write_bytes(raw);d.update(sha256=hashlib.sha256(raw).hexdigest(),size=len(raw))
            except Exception as exc:d['error']=type(exc).__name__+': '+str(exc)
            (out/(name+'.json')).write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8');print(d)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bounded-source-recovery
          path: evidence/
          retention-days: 7
          if-no-files-found: error
