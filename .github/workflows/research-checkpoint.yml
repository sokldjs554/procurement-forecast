name: Research checkpoint (no deployment)

on:
  pull_request:
    paths:
      - .github/workflows/research-checkpoint.yml

permissions:
  contents: read

jobs:
  checkpoint:
    if: github.event.pull_request.number == 65 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: code
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2a82dabc8f28b4494439bff148078522f4a44fe9
          path: evidence
          persist-credentials: false
      - name: Archive tracked research inputs and code only
        shell: bash
        run: |
          set -euo pipefail
          mkdir checkpoint
          git -C code rev-parse HEAD > checkpoint/code-sha.txt
          git -C evidence rev-parse HEAD > checkpoint/evidence-sha.txt
          git -C code archive --format=tar.gz HEAD apps/api scripts docs/data docs/local-llm.md AGENTS.md .github > checkpoint/code.tar.gz
          git -C evidence archive --format=tar.gz HEAD docs/data > checkpoint/evidence.tar.gz
          (cd checkpoint && sha256sum code.tar.gz evidence.tar.gz > SHA256SUMS)
      - name: Portable research dependencies for offline verification
        run: |
          python -m pip download --dest checkpoint/wheels --only-binary=:all: --python-version 3.13 --platform manylinux2014_x86_64 arq structlog asyncpg pgvector anthropic redis tenacity respx ruff mypy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: research-checkpoint
          path: checkpoint/
          if-no-files-found: error
          retention-days: 1
