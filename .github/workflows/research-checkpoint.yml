name: Research checkpoint (no deployment)

on:
  pull_request:
    paths:
      - .github/workflows/research-checkpoint.yml

permissions:
  contents: read

jobs:
  checkpoint:
    if: github.event.pull_request.number == 65 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          python-version: "3.11"
      - name: Preserve locked offline verification runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir checkpoint
          git rev-parse HEAD > checkpoint/code-sha.txt
          uv sync --project apps/api --frozen
          PYTHON_ROOT=$(dirname "$(dirname "$(readlink -f apps/api/.venv/bin/python)")")
          tar -czf checkpoint/python311.tar.gz -C "$PYTHON_ROOT" .
          tar -czf checkpoint/locked-site-packages.tar.gz -C apps/api/.venv/lib/python3.11/site-packages .
          cp apps/api/uv.lock checkpoint/uv.lock
          (cd checkpoint && sha256sum *.tar.gz uv.lock > SHA256SUMS)
      - name: Archive new official sources before evaluation
        shell: python
        run: |
          import datetime, hashlib, json, pathlib, time, urllib.error, urllib.parse, urllib.request, urllib.robotparser
          out = pathlib.Path('checkpoint/fresh-v5-sources')
          out.mkdir()
          agent = 'ProcurementForecastResearch/1.0'
          targets = [
              ('mungyeong-3433', 'https://council.gbmg.go.kr/viewer/minutes/3433.do'),
              ('incheon-dong-2058', 'https://council.icdonggu.go.kr/viewer/minutes/2058.do'),
              ('okcheon-15645', 'https://council.oc.go.kr/viewer/minutes/15645.do'),
              ('yangyang-7348', 'https://council.yangyang.go.kr/viewer/minutes/7348.do'),
          ]
          robots = {}
          for name, url in targets:
              record = {'id': name, 'url': url, 'retrieved_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'model_executed': False}
              try:
                  host = urllib.parse.urlsplit(url).netloc
                  if host not in robots:
                      robots_url = 'https://' + host + '/robots.txt'
                      try:
                          with urllib.request.urlopen(urllib.request.Request(robots_url, headers={'User-Agent': agent}), timeout=30) as r:
                              raw = r.read()
                          (out / (host + '-robots.txt')).write_bytes(raw)
                          policy = urllib.robotparser.RobotFileParser()
                          policy.parse(raw.decode('utf-8', errors='replace').splitlines())
                      except urllib.error.HTTPError as exc:
                          if exc.code != 404:
                              raise
                          policy = None
                          record['robots_status'] = 404
                      robots[host] = policy
                  policy = robots[host]
                  if policy is not None and not policy.can_fetch(agent, url):
                      raise RuntimeError('robots.txt disallows this source')
                  time.sleep(max(2, (policy.crawl_delay(agent) or 0) if policy else 0))
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': agent}), timeout=40) as r:
                      raw = r.read()
                      record.update(status=r.status, final_url=r.url, headers={k: r.headers.get(k) for k in ('Content-Type', 'Last-Modified', 'ETag')})
                  (out / (name + '.html')).write_bytes(raw)
                  record.update(sha256=hashlib.sha256(raw).hexdigest(), size=len(raw))
              except Exception as exc:
                  record['error'] = str(exc)
              (out / (name + '.json')).write_text(json.dumps(record, ensure_ascii=False, indent=2), encoding='utf-8')
              print(json.dumps(record, ensure_ascii=False))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: research-checkpoint
          path: checkpoint/
          if-no-files-found: error
          retention-days: 7
