name: Research checkpoint (no deployment)

on:
  pull_request:
    paths:
      - .github/workflows/research-checkpoint.yml

permissions:
  contents: read

jobs:
  checkpoint:
    if: github.event.pull_request.number == 65 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Archive a bounded set of public research sources without executing a model
        shell: python
        run: |
          import datetime, hashlib, json, pathlib, time, urllib.error, urllib.parse, urllib.request, urllib.robotparser
          out = pathlib.Path('checkpoint/fresh-v6-primary')
          out.mkdir(parents=True)
          agent = 'ProcurementForecastResearch/1.0'
          targets = [
              ('namyangju-3729', 'https://www.nyjc.go.kr/minutes/svc/web/cms/mnts/SvcMntsViewer.php?mode=spkr1&schSn=3729&spkrCd=MBR9010'),
              ('cheongju-3754', 'https://councilrec.cheongju.go.kr/minutes/svc/web/cms/mnts/SvcMntsViewer.php?schSn=3754'),
              ('cheongju-3707', 'https://councilrec.cheongju.go.kr/minutes/svc/web/cms/mnts/SvcMntsViewer.php?schSn=3707'),
              ('gangnam-budget-list', 'https://www.gangnam.go.kr/board/B_000742/list.do?mid=ID05_050302&pgno=2'),
              ('gangnam-public-viewer', 'https://viewer.gangnam.go.kr/SynapDocViewServer/viewer/main.do?filename=02a54cd5-102a-4082-b6dc-37aeb728b39c'),
              ('exact-input-archive', 'https://archive.org/wayback/available?url=www.gncouncil.go.kr%2Fattach%2Fcouncil_text%2F323%2F323_3_20.pdf&timestamp=20250729'),
          ]
          policies = {}
          for name, url in targets:
              record = {'id': name, 'url': url, 'retrieved_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'model_executed': False}
              try:
                  parts = urllib.parse.urlsplit(url)
                  host = parts.netloc
                  if parts.path.startswith('/file/'):
                      raise RuntimeError('excluded attachment path')
                  if host not in policies:
                      robots_url = 'https://' + host + '/robots.txt'
                      try:
                          with urllib.request.urlopen(urllib.request.Request(robots_url, headers={'User-Agent': agent}), timeout=15) as r:
                              raw = r.read()
                          (out / (host + '-robots.txt')).write_bytes(raw)
                          policy = urllib.robotparser.RobotFileParser()
                          policy.parse(raw.decode('utf-8', errors='replace').splitlines())
                      except urllib.error.HTTPError as exc:
                          if exc.code != 404:
                              raise
                          policy = None
                          record['robots_status'] = 404
                      policies[host] = policy
                  policy = policies[host]
                  if policy is not None and not policy.can_fetch(agent, url):
                      raise RuntimeError('robots.txt disallows source')
                  time.sleep(max(2, (policy.crawl_delay(agent) or 0) if policy else 0))
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': agent}), timeout=30) as r:
                      raw = r.read(16000000)
                      record.update(status=r.status, final_url=r.url, headers={k: r.headers.get(k) for k in ('Content-Type', 'Last-Modified', 'ETag')})
                  (out / (name + '.raw')).write_bytes(raw)
                  record.update(sha256=hashlib.sha256(raw).hexdigest(), size=len(raw))
              except Exception as exc:
                  record['error'] = type(exc).__name__ + ': ' + str(exc)
              (out / (name + '.json')).write_text(json.dumps(record, ensure_ascii=False, indent=2), encoding='utf-8')
              print(json.dumps(record, ensure_ascii=False))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fresh-v6-primary
          path: checkpoint/
          if-no-files-found: error
          retention-days: 7
