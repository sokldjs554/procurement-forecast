name: Final public-source proof (no model or deployment)
on:
  push:
    branches: [eval/2026-10-01-final-source-proof]
    paths: [.github/workflows/final-source-proof.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Archive one selected official meeting without model execution
        shell: python
        run: |
          import datetime,hashlib,json,pathlib,time,urllib.request,urllib.error,urllib.robotparser
          root='https://council.goseong.go.kr'
          url=root+'/record/recordView.do?key=1d26187d4c36c5edb8eec98727a8c30daa76ba3eb6ce467f2c49548a43efc35c1e13cf6928ddc653'
          out=pathlib.Path('evidence');out.mkdir();agent='ProcurementForecastResearch/1.0'
          d={'id':'goseong-20241209','url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'model_executed':False}
          try:
            try:
              with urllib.request.urlopen(urllib.request.Request(root+'/robots.txt',headers={'User-Agent':agent}),timeout=20) as r: robot=r.read()
              (out/'robots.txt').write_bytes(robot);p=urllib.robotparser.RobotFileParser();p.parse(robot.decode('utf-8',errors='replace').splitlines())
              if not p.can_fetch(agent,url):raise RuntimeError('robots excludes source')
              time.sleep(max(2,p.crawl_delay(agent) or 0))
            except urllib.error.HTTPError as exc:
              if exc.code!=404:raise
              d['robots_status']=404
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=35) as r: raw=r.read();d.update(status=r.status,final_url=r.url)
            (out/'goseong-20241209.raw').write_bytes(raw);d.update(sha256=hashlib.sha256(raw).hexdigest(),size=len(raw))
          except Exception as exc:d['error']=str(exc)
          (out/'goseong-20241209.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8');print(d)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: final-source-proof
          path: evidence/
          retention-days: 7
          if-no-files-found: error
