name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, types, tests, eval gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v7
      - name: OCR engine, Korean fonts, ffmpeg (the media stage cuts and reads a synthetic meeting video)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor fonts-nanum ffmpeg
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          # the lockfile forks numpy by Python version; CI must type-check what production runs
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest (unit + integration against PostgreSQL/Redis)
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - name: OpenAPI schema matches the committed copy used by the web app
        run: |
          uv run manage openapi > "$RUNNER_TEMP/openapi.json"
          diff -u ../web/openapi.json "$RUNNER_TEMP/openapi.json" || {
            echo "::error::apps/web/openapi.json is stale. Run 'make gen-api' and commit the result."; exit 1; }
      - name: Demo pipeline end to end
        run: |
          uv run manage db upgrade
          uv run manage seed --anchor 2026-09-25
          uv run manage demo run
      - name: Quality gate on the synthetic ground truth
        run: |
          uv run manage eval all --report "$RUNNER_TEMP/evaluation.md" > "$RUNNER_TEMP/eval.json"
          jq -e '
            .extraction.precision >= 0.95 and .extraction.recall >= 0.95 and
            .linking.pairwise.precision >= 0.95 and .linking.pairwise.recall >= 0.95 and
            .ocr.amount_token_accuracy_corrected >= 0.98 and .ocr.cer_corrected <= 0.03
          ' "$RUNNER_TEMP/eval.json" || { echo "::error::evaluation below threshold"; cat "$RUNNER_TEMP/evaluation.md"; exit 1; }
          cat "$RUNNER_TEMP/evaluation.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-reports
          path: |
            apps/api/coverage.xml
            ${{ runner.temp }}/eval.json
            ${{ runner.temp }}/evaluation.md
          if-no-files-found: ignore

  web:
    name: Web · types, lint, tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match openapi.json
        run: |
          pnpm exec openapi-typescript openapi.json -o src/lib/api/schema.d.ts
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E · README walkthrough in a browser
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_LOG_JSON: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: OCR engine and Korean fonts (the demo world includes scanned budget books)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor fonts-nanum
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Seed the walkthrough world (the one the README GIF shows)
        working-directory: apps/api
        # anchored on today (KST) because the API reads the real date for windows and lead times
        run: |
          uv sync --frozen
          uv run manage db upgrade
          uv run manage seed --anchor "$(TZ=Asia/Seoul date +%F)" --scale 1.5
          uv run manage demo run
      - name: Start the API
        working-directory: apps/api
        run: |
          nohup uv run uvicorn --factory app.api.app:create_app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS localhost:8000/healthz > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build and start the web app (production build, BFF pointed at the API)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          API_ORIGIN=http://localhost:8000 nohup pnpm start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS localhost:3000/ > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/web.log"; exit 1
      - name: Playwright
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore

  terraform:
    name: Terraform · fmt, validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  images:
    name: Docker images
    needs: [api, web]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: false
          tags: app-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Render production API and worker image
        if: matrix.app == 'api'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/render-api.Dockerfile
          push: false
          tags: procurement-render:ci
          cache-from: type=gha,scope=render-api
          cache-to: type=gha,mode=max,scope=render-api
