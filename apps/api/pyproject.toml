[project]
name = "procurement-forecast"
version = "0.1.0"
description = "B2G pre-procurement signal intelligence: reads council minutes and budget books to surface public demand months before the tender."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.2",
    "numpy>=2.0",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "anthropic>=1.8",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "olefile>=0.47",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    "typer>=0.12",
    "reportlab>=4.2",
]

[project.optional-dependencies]
gcp = ["google-cloud-storage>=2.18"]
# Local Whisper for council video (app/media/stt.py). Optional: it brings CTranslate2 and a model
# download, and CI runs the media pipeline on recorded transcripts.
stt = ["faster-whisper>=1.1"]

[project.scripts]
manage = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "N", "C4", "DTZ", "PL"]
ignore = [
    "RUF001", "RUF002", "RUF003", # Korean text legitimately contains full-width punctuation
    "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915",
    "S101",  # asserts are fine in tests and invariants
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "PLC0415",  # deliberate lazy imports: optional deps (GCS, pypdfium2) and import cycles
    "PLR0917",  # keyword-heavy service functions
    "E501",  # the formatter owns line length; Korean text is double-width and would fight it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PT018", "C408", "ASYNC240"]
"src/app/db/session.py" = ["PLW0603"]
"src/app/sources/resilience.py" = ["S105"]  # a Lua script constant, not a password
"migrations/**" = ["E501"]
"src/app/demo/**" = ["S311"]  # synthetic data uses non-crypto RNG on purpose
"src/app/bench.py" = ["S608"]  # benchmark SQL is assembled from module constants only

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["app"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*", "olefile.*", "pypdfium2.*", "reportlab.*", "asyncpg", "asyncpg.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL (pgvector) and Redis — see tests/conftest.py",
]
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]
